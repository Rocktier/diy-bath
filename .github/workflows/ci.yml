name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 取消旧任务，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试与构建校验
    runs-on: windows-latest
    steps:
      # 之前停在 v4，是因为「还在 Node 20 上跑会被警告，而 v5 当时不存在」。
      # 现在这些都出了 Node 24 版本，照警告里点名的顺序升到当前稳定版：
      #   checkout v7 / setup-node v7 / upload-artifact v7
      # 主版本一次跳了三段，不凭感觉升——让 CI 全绿来证明
      # （单测 + 覆盖率阈值 + Windows 编译 + Linux 编译）。
      # 万一 v7 改了行为，CI 会红，回退即可。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cargo.lock 已提交，用 --locked 校验：
      # 依赖被篡改或 lock 与 Cargo.toml 不同步时直接失败，而不是悄悄拉新版本。
      - name: 校验 Cargo.lock 未被改动
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > $null

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # npm 11 会拦 esbuild 的 postinstall，不放行 vitest 跑不起来
      - name: 放行必要的安装脚本
        run: |
          npm install-scripts approve esbuild || true
          npm rebuild esbuild

      # GitHub 的 YAML 语法错误只会报「0 秒 failure + 无日志」，看不出原因。
        # 本地/这里先拦一道，秒级出结果。
      - name: 校验 workflow 语法
        run: npm run lint:workflows

      - name: 版本号一致性
        run: node scripts/check-version.mjs

      - name: 批处理文件编码规范
        run: node scripts/fix-bat.js

      - name: 单元测试 + 覆盖率
        run: npm run test:coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # 只验证「能编译出 exe」，不做安装包。完整打包留给 release 工作流，省 CI 时间。
      - name: 编译
        run: npm run tauri build -- --no-bundle

      - name: 上传未打包的可执行文件
        uses: actions/upload-artifact@v7
        with:
          name: diy-bath-ci-exe
          path: src-tauri/target/release/diy-bath.exe
          retention-days: 7

  # 验证 Linux 侧还能编。
  #
  # 这里不用交叉编译。aarch64 交叉编译需要给每个 -dev 包都准备
  # aarch64 版本，GitHub runner 上没有，实测会卡在
  # 「pkg-config has not been configured to support cross-compilation」。
  # 要出 aarch64 产物，正确做法是用 ARM 原生 runner 或自建，
  # 属于以后要做的事。
  #
  # 当前只保证 Linux + x86_64 能编——这已经能挡住绝大多数
  # 「只在 Windows 上能编」的写法（比如路径分隔符、盘符）。
  linux:
    name: Linux 编译校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - run: npm ci

      - name: 放行必要的安装脚本
        run: |
          npm install-scripts approve esbuild || true
          npm rebuild esbuild

      - name: 编译
        run: npm run tauri build -- --no-bundle