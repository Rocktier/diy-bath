name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 校验 Cargo.lock
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > $null

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release

      - run: npm ci

      - name: 放行必要的安装脚本
        run: |
          npm install-scripts approve esbuild || true
          npm rebuild esbuild

      - name: 校验 workflow 语法
        run: npm run lint:workflows

      - name: 发版前跑测试
        run: npm run test:coverage

      # 版本号统一从 tag 取。package.json 与 Cargo.toml 显式改，
      # tauri.conf.json 的版本由 scripts/sync-version.mjs 一并改
      # （早期靠 tauri-action 的 tag_name 注入，去掉那个 action 后这里会漏）。
      # 版本号统一到 tag。刻意用脚本而不是 PowerShell 一行正则：
      # 原来的 `$lock -replace '(?m)^version = ".*"$'` 会匹配 Cargo.lock 里
      # **每一行** version，把全部 417 个 crate 的版本一起改成应用版本号，
      # tauri 也从 2.12.1 变成 0.3.0，于是 Tauri CLI 报
      # 「tauri (v0.3.0) : @tauri-apps/api (v2.12.1) 版本不匹配」，
      # Release 工作流从上线起就没成功发布过。
      # scripts/sync-version.mjs 只按包名精确定位本包，并在改完核对依赖没被动。
      - name: 同步版本号到 tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $env:INPUT_TAG -replace '^v', ''
          }
          if (-not $tag) { throw '取不到版本号' }
          if ($tag -notmatch '^\d+\.\d+\.\d+$') { throw "版本号格式不对: $tag" }
          Write-Host "版本: $tag"
          node scripts/sync-version.mjs $tag

      - name: 校验版本号已同步
        run: node scripts/check-version.mjs

      # 刻意不签名。SmartScreen 的警告只针对未签名程序，不影响使用；
      # 证书要花钱（OV 约 2000-5000 元/年），且 CI 里不该放私钥。
      # 面向公众分发时在这里加签名配置 + GitHub Secrets 里的证书与密码。

      # 自己构建，不用 tauri-action。
      # 之前用 tauri-action 传的是 tag_name / release_name 这种蛇形，
      # 而它要的是驼峰 tagName / releaseName —— 全部被忽略，日志里是：
      #   Unexpected input(s) tag_name, release_name, ...
      #   No releaseId or tagName provided, skipping all uploads...
      # 结果构建成功了，安装包一个都没传上去，Release 里是个空壳
      #（后面 softprops 顺手建的无附件 draft）。
      # 职责分清：npm 构建，softprops 只负责建 release + 挂文件。
      - name: 构建安装包
        shell: pwsh
        run: npm run tauri:build -- --bundles nsis

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe'
          if (-not $setup) { throw '没找到安装包，构建可能失败了' }

          # 产物名一律用 ASCII，**不要**直接用 NSIS 生成的中文名。
          # v0.3.0 那次传上去的文件叫 `_0.3.0_x64-setup.exe`——
          # 「浴室柜画图工具」六个字被整个吃掉，而且**全程没有报错**，
          # release 页面看着一切正常，导购员拿到的却是个看不出是什么的安装包。
          # 成因是 Windows runner 上非 ASCII 文件名经过上传环节被改写，
          # 与本仓库的编码设置无关（tauri.conf.json 的 productName 是好的）。
          # 与其赌上传器的行为，不如在收集时就把名字定死。
          $ver = if ($setup.BaseName -match '_(\d+\.\d+\.\d+)_') { $Matches[1] }
          if (-not $ver) { throw "从安装包名里取不到版本号：$($setup.Name)" }
          $setupName = "BathroomCabinet-$ver-x64-setup.exe"
          Copy-Item $setup.FullName "out/$setupName"
          Copy-Item 'src-tauri/target/release/diy-bath.exe' 'out/diy-bath.exe'

          # 守一道：产物名里有非 ASCII 就直接失败。
          # 这类问题第一次就是这么漏出去的——传了个名字被改写的东西，
          # 没报错、页面看着正常，等到客户拿到手才发现。
          $bad = Get-ChildItem out -File | Where-Object { $_.Name -match '[^\x00-\x7F]' }
          if ($bad) {
            throw "产物名含非 ASCII 字符，会在上传时被改写：$($bad.Name -join ', ')"
          }
          $expected = @("BathroomCabinet-$ver-x64-setup.exe", 'diy-bath.exe')
          $missing = $expected | Where-Object { -not (Test-Path "out/$_") }
          if ($missing) {
            throw "产物不对齐，缺：$($missing -join ', ')"
          }

          Get-ChildItem out | ForEach-Object {
            Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,2)) MB"
          }

      # 收一份到 artifact，方便不翻 Release 页面也能取
      - name: 上传产物到 artifact
        uses: actions/upload-artifact@v4
        with:
          name: diy-bath-${{ github.event.inputs.tag || github.ref_name }}
          path: out/*
          retention-days: 30

      - name: 建 draft release 并挂上安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 浴室柜画图工具 ${{ github.event.inputs.tag || github.ref_name }}
          # 发给导购员看，所以正文写「怎么装」而不是「见 CHANGELOG.md」。
          # 完整改动仍然链到 CHANGELOG。
          body: |
            ## 怎么用

            1. 下载 `BathroomCabinet-*-x64-setup.exe`
            2. 双击，一路「下一步」装完
            3. 开始菜单里点「浴室柜画图工具」，或用桌面快捷方式

            **不需要装 Node、不需要装浏览器**，只依赖 Windows 自带的 WebView2。

            ## 两个页签

            | 页签 | 快捷键 | 用途 |
            |---|---|---|
            | 3D | `2` | 给客户看装上是什么样。左键拖动旋转 · 滚轮缩放 · 右键平移，`R` 重置 |
            | 正视图 | `3` | 讲正面布局与尺寸标注，图纸铺满整个右栏，可导出 PNG / SVG |

            两个视图来自同一份零件数据，不会出现「正视图 6 个抽屉、3D 里 4 个」。

            完整改动见 [CHANGELOG.md](https://github.com/Rocktier/diy-bath/blob/${{ github.event.inputs.tag || github.ref_name }}/CHANGELOG.md)。
          draft: true
          files: out/*
          # 传了 files 却一个都没匹配上时要失败，
          # 否则又会出现「Release 建出来了但是空的」这种情况
          fail_on_unmatched_files: true
