<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浴室柜画图工具</title>
<style>
  /* 设计方向：ui-ux-pro-max 的 "Developer Tool / IDE" 规则
     风格 = Dark Mode + Minimalism & Swiss，配色情绪 = 深色 + 单一强调色。
     该类目的反模式明确写着「Light mode default + Slow performance」，
     所以深色是推荐而非偷懒。图纸本身画在白底上，不受外壳深浅影响。 */

  :root {
    --bg:#14161a; --panel:#1c1f24; --panel2:#22262c; --line:#2b3038;
    --fg:#e9e7e4; --dim:#8d949c; --acc:#c9a227; --err:#e06c5c;
    /* 单一强调色。Swiss 风格要求 accent 只有一种，多了就吵。 */
    --focus:#c9a227;
    --r:6px;
    --ease:cubic-bezier(.2,.6,.3,1);
    --dur:150ms;
  }
  /* 告诉 WebView2 这是深色界面，否则原生滚动条和表单控件会渲染成浅色，
     夹在深色面板里非常刺眼。 */
  :root { color-scheme:dark; }

  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    /* 用 flex 分配高度，不要写 calc(100vh - 47px)：
       那个 47 是当时 header 的实际高度，改一次布局就全错，而且错得很隐蔽
       （内容被挤到视口外，只表现为"看不到底"）。 */
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------------------------------------------------------------- 焦点 */
  /* 键盘焦点必须看得见。统一成一条 token 化的环。
     选择器刻意写得比下面的 `.row input:focus` 更具体：
     :focus-visible 单独用只有 (0,1,0)，会被 .row input:focus 的 (0,2,1)
     压掉，outline:none 一旦生效焦点就彻底没了——这类问题 CSS 看着完全正常。 */
  :where(button, select, input, textarea, [tabindex]):focus-visible {
    outline:2px solid var(--focus); outline-offset:2px; border-radius:3px;
  }
  .row input:focus-visible, .row select:focus-visible,
  #hist:focus-visible, .band .hd .x:focus-visible {
    outline:2px solid var(--focus); outline-offset:1px;
    border-color:var(--focus);
  }
  /* 双写一次 :focus-:focus-visible 是故意的：
     下面 .row input:focus 里的 outline:none 与上面这条优先级相同（都是 0,2,1），
     后写的赢，于是输入框的焦点环被自己的规则抹掉。
     多一个伪类把它抬到 (0,3,1) 才压得住。 */
  .row input:focus:focus-visible, .row select:focus:focus-visible {
    outline:2px solid var(--focus); outline-offset:1px;
  }

  /* ---------------------------------------------------------------- 头部 */
  header {
    flex:0 0 auto;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .hrow { display:flex; align-items:center; gap:10px; padding:8px 14px 6px; }
  header h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  .sp { flex:1; min-width:0; }

  /* 预设单独一行，单行横向滚动。
     原来 10 个预设按钮和视图页签、历史、缩放、导出全挤在 header 一行，
     flex 容器不换行而 #presetBar 内部换行，实测把 header 撑到 381px 高——
     吃掉三分之一视口，还因为 header 是 sticky 的而一直占着。 */
  #presetBar {
    display:flex; gap:5px; flex-wrap:nowrap;
    overflow-x:auto; overflow-y:hidden;
    padding:0 14px 8px; scrollbar-width:thin;
  }
  #presetBar::-webkit-scrollbar { height:6px; }
  #presetBar::-webkit-scrollbar-thumb { background:#33383f; border-radius:3px; }

  .btn {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:var(--r); padding:4px 10px; cursor:pointer; font:inherit;
    white-space:nowrap;
    transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .btn:hover { border-color:var(--acc); }
  .btn.on { background:var(--acc); border-color:var(--acc); color:#1a1a1a; font-weight:600; }
  .btn:active { transform:translateY(.5px); }

  /* ---------------------------------------------------------------- 主体 */
  main {
    flex:1; min-height:0;                 /* 少了它，grid 子项撑破容器不滚动 */
    display:grid; grid-template-columns:352px 1fr;
  }
  #form { overflow:auto; border-right:1px solid var(--line); background:var(--panel); padding:10px 12px 80px; }
  #preview { overflow:auto; padding:14px; display:flex; flex-direction:column; gap:14px; }

  fieldset { border:1px solid var(--line); border-radius:var(--r); margin:0 0 10px; padding:8px 10px 10px; }
  legend { color:var(--acc); font-size:12px; padding:0 6px; }

  /* ---------------------------------------------------- 分组手风琴
     之前 6 个 fieldset 全部平铺展开，36 个输入框一路铺下去。
     屏幕再高也不够——面板高度是死的，跟屏幕多大无关。
     改成可折叠，并且**折叠头直接显示当前值**，
     「现在是多大」不用展开就能看到，只在真要改时才点开。 */
  .grp {
    border:1px solid var(--line); border-radius:var(--r);
    margin:0 0 6px; background:var(--panel2); position:relative; overflow:hidden;
  }
  .grp > summary {
    display:flex; align-items:center; gap:9px;
    padding:9px 11px; cursor:pointer; list-style:none; user-select:none;
    transition:background var(--dur) var(--ease);
  }
  .grp > summary::-webkit-details-marker { display:none; }
  .grp > summary::marker { content:''; }
  .grp > summary:hover { background:#272c33; }
  .grp > summary:focus-visible { outline:2px solid var(--focus); outline-offset:-2px; }

  /* chevron 用两条 border 画，不引图标字体 */
  .grp > summary::before {
    content:''; flex:0 0 auto; width:6px; height:6px;
    border-right:1.6px solid var(--dim); border-bottom:1.6px solid var(--dim);
    transform:rotate(-45deg); transition:transform var(--dur) var(--ease);
  }
  .grp[open] > summary::before { transform:rotate(45deg); }
  .grp[open] > summary { border-bottom:1px solid var(--line); }
  /* 展开的那组用左边缘一条金色细带标出来 */
  .grp[open]::before {
    content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
    background:var(--acc); z-index:1;
  }

  .gname { color:var(--fg); font-size:13px; font-weight:600; flex:0 0 auto; }
  /* 摘要用等宽数字，改参数时摘要宽度不会左右抖 */
  .gsum {
    color:var(--dim); font-size:11.5px; font-variant-numeric:tabular-nums;
    margin-left:auto; text-align:right;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .gbody { padding:8px 11px 10px; }

  /* 整行可点：label 关联控件后，勾选框不再只有 13×13 那么一点地方可按。
     makeRow() 里给 label 补了 htmlFor，这里把它做成手型提示。 */
  .row { display:grid; grid-template-columns:1fr 96px; gap:8px; align-items:center; margin:4px 0; }
  .row > label { color:var(--dim); font-size:12.5px; cursor:pointer;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row input, .row select {
    width:100%; background:#111419; color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:4px 7px; font:inherit;
    /* 尺寸是这个工具的唯一输入内容。等宽数字让「1 → 10 → 100」时字符不左右跳，
       否则每敲一位，光标后面的东西都在动，眼睛要重新找位置。
       36 个输入框此前全部没有这一条。 */
    font-variant-numeric:tabular-nums;
    transition:border-color var(--dur) var(--ease);
  }
  .row input:hover, .row select:hover { border-color:#3a4049; }
  .row input:focus, .row select:focus { outline:none; border-color:var(--acc); }
  /* 勾选框放大到 16px 并撑满单行高度，13px 在桌面端也偏小 */
  .row input[type=checkbox] { width:16px; height:16px; justify-self:start; margin:0; accent-color:var(--acc); cursor:pointer; }

  .band { border:1px solid var(--line); border-radius:var(--r); padding:7px 8px; margin:6px 0; background:#191d22; }
  .band .hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .band .hd b { font-weight:600; font-size:12.5px; }
  /* 「删除」此前只有 36×19，按不准。给足高度。 */
  .band .hd .x { background:none; border:1px solid transparent; color:var(--err);
                 cursor:pointer; font:inherit; font-size:12px;
                 padding:2px 8px; border-radius:4px; min-height:24px; }
  .band .hd .x:hover:not(:disabled) { border-color:var(--err); }
  .band .hd .x:disabled { color:#555; cursor:not-allowed; }

  /* ---------------------------------------------------------------- 图纸 */
  figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:8px; }
  /* 标题压在白底上，不能用 --dim（#8d949c 对白只有 3.07:1，达不到 AA）。
     #5f666e 是 5.8:1。这行字标的是「这张是什么图」，
     看不清就直接找不到要的那张。 */
  figure figcaption { color:#5f666e; font-size:12px; margin-bottom:5px; }
  /* panzoom 只改 svg 的 transform，所以容器负责裁掉溢出。
     高度跟着图纸自身的宽高比走：写死 62vh 的话，
     又宽又矮的正视图会空掉一大半，白白吃掉视口。 */
  figure .zoomwrap { overflow:hidden; border-radius:4px; }
  figure .zoomwrap svg { width:100%; height:auto; display:block; cursor:grab; }
  figure .zoomwrap svg > g { transform-origin:0 0; }
  figure .zoomwrap svg > g.panning { cursor:grabbing; }

  /* ---------------------------------------------------------------- 3D */
  .tabs { display:flex; gap:3px; padding:2px; background:#111419;
           border:1px solid var(--line); border-radius:7px; }
  .tabs .btn { border:0; background:transparent; padding:3px 12px; }
  .tabs .btn.on { background:var(--acc); color:#1a1a1a; }

  #stage3d { min-height:0; background:#fff; border:1px solid var(--line);
             border-radius:var(--r); position:relative; overflow:hidden; }
  #stage3d.hidden, #preview.hidden { display:none; }
  #stage3d canvas { display:block; width:100%; height:100%; }

  /* 操作说明压在 3D 画面上。原来的 #8d949c 配白底只有 3.07:1，
     达不到 AA 的 4.5:1 —— 而这行字是教用户怎么用的全部说明，
     恰恰最该看清。改成深色字 + 一点白底衬板，
     柜体填到画面底部时也不会糊掉。 */
  .hint3d {
    position:absolute; left:8px; bottom:8px;
    color:#3f444b; font-size:11.5px;
    background:rgba(255,255,255,.92);
    border:1px solid rgba(0,0,0,.12); border-radius:5px;
    padding:3px 8px; pointer-events:none; user-select:none;
  }

  /* ---------------------------------------------------------------- 杂项 */
  .zoomer { display:flex; align-items:center; gap:5px; }
  fieldset.hidden, .zoomer.hidden { display:none; }
  .zoomer #zoomLabel { min-width:46px; text-align:center; color:var(--dim); font-size:12px;
                       font-variant-numeric:tabular-nums; }
  .zoomer .btn { padding:3px 9px; }
  #err { color:var(--err); background:#2a1e1e; border:1px solid #4a2a2a; border-radius:var(--r); padding:8px 10px; font-size:12.5px; }
  .hint { color:var(--dim); font-size:11.5px; margin:2px 0 6px; }
  #hist { width:170px; background:#111419; color:var(--fg); border:1px solid var(--line);
          border-radius:var(--r); padding:4px 6px; font:inherit; }

  @media (max-width:900px){
    body { overflow:auto; }
    main { grid-template-columns:1fr; }
    #form { border-right:0; border-bottom:1px solid var(--line); }
    #stage3d { min-height:420px; }
  }

  /* 前庭功能敏感、或用户明确要求减少动效时，一律不做过渡。
     本项目动效很轻（只有 150ms 的边框与背景），但「关掉」必须是真关掉。 */
  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after {
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
    .btn:active { transform:none; }
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>浴室柜画图工具</h1>
    <div class="tabs" role="group" aria-label="视图模式">
      <button class="btn on" data-mode="3d" aria-pressed="true">3D</button>
      <button class="btn" data-mode="ortho" aria-pressed="false">正视图</button>
    </div>
    <button class="btn" id="btnResetView" title="回到默认视角">重置视角</button>
    <span class="sp"></span>
    <button class="btn" id="btnExpandAll" title="展开或收起全部分组">全部展开</button>
    <select id="hist" title="历史方案" aria-label="历史方案"><option value="">— 历史方案 —</option></select>
    <div class="zoomer" role="group" aria-label="正视图缩放">
      <button class="btn" id="zoomOut" aria-label="缩小" title="缩小">−</button>
      <span id="zoomLabel">100%</span>
      <button class="btn" id="zoomIn" aria-label="放大" title="放大">＋</button>
      <button class="btn" id="zoomFit" title="适应宽度">适应</button>
      <button class="btn" id="zoom100" title="实际大小">1:1</button>
    </div>
    <button class="btn" id="btnPng">导出 PNG</button>
    <button class="btn" id="btnSvg">导出 SVG</button>
  </div>
  <!-- 「重置视角」从页签里挪出来了：它只对 3D 有意义，
       放在两个视图页签中间会让人以为三视图也能重置视角。 -->
  <div id="presetBar" role="group" aria-label="常用柜型预设"></div>
</header>
<main>
  <div id="form"></div>
  <div id="stage3d"></div>
  <div id="preview"></div>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
