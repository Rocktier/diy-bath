<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浴室柜画图工具</title>
<style>
  :root {
    --bg:#14161a; --panel:#1c1f24; --panel2:#22262c; --line:#2b3038;
    --fg:#e9e7e4; --dim:#8d949c; --acc:#c9a227; --err:#e06c5c;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  }
  header {
    display:flex; align-items:center; gap:14px; padding:9px 16px;
    border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:10;
  }
  header h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  #presetBar { display:flex; gap:5px; flex-wrap:wrap; flex:1; min-width:0; }
  .btn {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; white-space:nowrap;
  }
  .btn:hover { border-color:var(--acc); }
  .btn.on { background:var(--acc); border-color:var(--acc); color:#1a1a1a; }
  main { display:grid; grid-template-columns:352px 1fr; height:calc(100vh - 47px); }
  #form { overflow:auto; border-right:1px solid var(--line); background:var(--panel); padding:10px 12px 80px; }
  #preview { overflow:auto; padding:14px; display:flex; flex-direction:column; gap:14px; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 10px; padding:8px 10px 10px; }
  legend { color:var(--acc); font-size:12px; padding:0 6px; }
  .row { display:grid; grid-template-columns:1fr 96px; gap:8px; align-items:center; margin:4px 0; }
  .row > label { color:var(--dim); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row input, .row select {
    width:100%; background:#111419; color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:4px 7px; font:inherit;
  }
  .row input:focus, .row select:focus { outline:none; border-color:var(--acc); }
  .row input[type=checkbox] { width:auto; justify-self:start; }
  .band { border:1px solid var(--line); border-radius:6px; padding:7px 8px; margin:6px 0; background:#191d22; }
  .band .hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .band .hd b { font-weight:600; font-size:12.5px; }
  .band .hd .x { background:none; border:0; color:var(--err); cursor:pointer; font-size:12px; }
  .band .hd .x:disabled { color:#555; cursor:not-allowed; }
  figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px; }
  figure figcaption { color:var(--dim); font-size:12px; margin-bottom:5px; }
  figure svg { width:100%; height:auto; display:block; }
  #err { color:var(--err); background:#2a1e1e; border:1px solid #4a2a2a; border-radius:6px; padding:8px 10px; font-size:12.5px; }
  .hint { color:var(--dim); font-size:11.5px; margin:2px 0 6px; }
  #hist { width:170px; background:#111419; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font:inherit; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; height:auto } #form{ border-right:0; border-bottom:1px solid var(--line) } }
</style>
</head>
<body>
<header>
  <h1>浴室柜画图工具</h1>
  <div id="presetBar"></div>
  <select id="hist" title="历史方案"><option value="">— 历史方案 —</option></select>
  <button class="btn" id="btnPng">导出 PNG</button>
  <button class="btn" id="btnSvg">导出 SVG</button>
</header>
<main>
  <div id="form"></div>
  <div id="preview"></div>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
