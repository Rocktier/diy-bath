<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VanityLab — 参数化浴室柜设计工具</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#eceff1;--panel:#fff;--line:#e2e6e8;--text:#20262b;--muted:#7a848c;--accent:#1f7a6f;--soft:#e6f2ef;--danger:#c0392b;--warn:#b8860b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;color:var(--text);font-size:13px}
body{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:0 0 auto}
.brand{font-weight:750;font-size:17px;letter-spacing:-.4px}.brand span{color:var(--accent)}
.tagline{font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--soft);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 9px;font-size:11px;cursor:pointer}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bcard{border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:6px;cursor:pointer;background:#fff}
.bcard:hover{border-color:var(--accent);background:var(--soft)}
.bcard b{display:block;font-size:12px}.bcard small{color:var(--muted);font-size:10px}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:30px;height:30px;border-radius:6px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;padding:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.seg button{border:0;background:#fff;padding:6px 9px;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent);color:#fff}
.main{flex:1;display:grid;grid-template-columns:234px 1fr 276px;min-height:0}
.sidebar{background:#fff;overflow:auto;padding:14px}
.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
.viewport{position:relative;min-width:0;background:linear-gradient(180deg,#f8fafb,#e6ebee)}
canvas{display:block;width:100%;height:100%}
#warn{position:absolute;left:14px;top:12px;background:#fff2f0;border:1px solid #e7b3ab;color:var(--danger);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;pointer-events:none;z-index:3}
#issues{position:absolute;left:14px;top:52px;background:#fff8e6;border:1px solid #e8d08a;color:#8a6d00;border-radius:6px;padding:7px 10px;font-size:11px;z-index:3;max-width:320px}
#issues .issue{margin-top:5px}
#issues button{border:1px solid #d9bd63;background:#fff;border-radius:4px;color:#8a6d00;font-size:10px;padding:2px 7px;cursor:pointer;margin-left:5px}
.hint{position:absolute;left:14px;bottom:12px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11px;color:var(--muted);pointer-events:none}
.ctxbar{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:none;gap:6px;padding:6px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:9px;z-index:4;box-shadow:0 4px 16px rgba(0,0,0,.1);max-width:94%;flex-wrap:wrap;justify-content:center}
.ctxbar.show{display:flex}
.ctxbar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;font-size:11px;cursor:pointer;color:var(--text)}
.ctxbar button:hover{border-color:var(--accent);background:var(--soft)}
body.mode-render #warn,body.mode-render #issues,body.mode-render #ctxbar,body.mode-render .hint{display:none!important}
.guide{position:absolute;left:14px;bottom:58px;width:260px;background:#fff;border:1px solid var(--accent);border-radius:9px;padding:12px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.guide[hidden]{display:none}.guide b{font-size:12px}.guide p{font-size:11px;color:var(--muted);margin:6px 0 10px;line-height:1.5}
.guide .row{justify-content:flex-end}
.badge{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;pointer-events:none}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;margin-bottom:12px;outline:none}
.search:focus{border-color:var(--accent)}
.sect{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;margin:14px 0 8px}
/* ponytail: native <details> for progressive disclosure — no JS, no state */
details.grp{border-top:1px solid var(--line);margin-top:10px;padding-top:7px}
details.grp>summary{list-style:none;cursor:pointer;font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸ '}details.grp[open]>summary::before{content:'▾ '}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;background:#fff;color:var(--text)}
details.menu>summary::-webkit-details-marker{display:none}
.menuBox{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:10;display:flex;flex-direction:column;gap:4px;min-width:132px}
.menuBox .btn{width:100%;text-align:left}
.legal{font-size:10px;line-height:1.5;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
.tile{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:grab;background:#fff;display:flex;align-items:center;gap:10px;transition:.12s}
.tile:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-1px)}
.tile:active{cursor:grabbing}.tile i{width:26px;height:26px;flex:0 0 auto;border-radius:5px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.tile b{font-weight:600;display:block;font-size:12px}.tile small{color:var(--muted);font-size:10px}
.h{font-size:14px;font-weight:700;margin:0 0 4px}.sub{color:var(--muted);font-size:11px;margin-bottom:14px}
.field{margin-bottom:11px}.field label{display:flex;justify-content:space-between;font-size:11px;color:#4d575e;margin-bottom:5px}
.field label b{color:var(--text);font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;align-items:center}.row input[type=number]{width:74px}
input[type=number],select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12px;outline:none;background:#fff}
input[type=number]:focus,select:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:18px}
.chk{display:flex;align-items:center;gap:8px;font-size:12px}
.empty{color:var(--muted);font-size:12px;line-height:1.6;padding:12px;border:1px dashed var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase}
.btn-del{color:var(--danger);border-color:#f0c9c4;width:100%;margin-top:6px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#f8fafb;color:var(--muted);font-size:13px;z-index:5}
#loading.err{color:var(--danger)}
.scrim{display:none;position:fixed;inset:56px 0 0;background:rgba(0,0,0,.38);z-index:3}
/* ponytail: native hidden attribute controls the first-run scene picker */
.start{position:fixed;inset:56px 0 0;background:rgba(15,24,27,.45);z-index:8;display:grid;place-items:center;padding:16px}
.start[hidden]{display:none}
.startBox{background:#fff;border-radius:12px;padding:22px;max-width:900px;width:100%;box-shadow:0 16px 50px rgba(0,0,0,.22)}
.startBox h2{margin:0 0 6px;font-size:20px}
.startBox p{margin:0 0 16px;color:var(--muted)}
.wiz{display:grid;grid-template-columns:1fr 1fr;gap:13px 22px}
.q>label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;font:inherit;font-size:12px;color:var(--text);cursor:pointer}
.opt:hover{border-color:var(--accent);background:var(--soft)}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.widthRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.widthRow input{width:110px}
.widthRow .chips{margin:0}
.startFoot{margin-top:18px;display:flex;justify-content:space-between;align-items:center}
@media(max-width:900px){.wiz{grid-template-columns:1fr}}
@media(min-width:901px){
  #mToggle{display:none}
  .main{grid-template-columns:234px 1fr 276px}
}
@media(min-width:901px) and (max-width:1200px){
  .main{grid-template-columns:200px 1fr 240px}
  .sidebar{padding:10px}
  .tagline{display:none}
}
@media(max-width:900px){
  .ctxbar{bottom:10px;max-width:96%}
  .ctxbar button{min-height:36px;padding:8px 11px}
  #modes{display:none}
}
@media(max-width:900px){
  .main{grid-template-columns:1fr}.sidebar{display:none}
  .left.show,.right.show{display:block;position:absolute;top:52px;bottom:0;width:min(86vw,310px);z-index:4;box-shadow:0 4px 20px rgba(0,0,0,.14);overflow:auto}
  .left{left:0}.right{right:0}.tagline{display:none}
  .scrim.show{display:block}
  .topbar{height:52px;padding:0 8px;gap:5px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
  .topbar::-webkit-scrollbar{display:none}
  .brand,.tagline{position:sticky;left:0;background:#fff;z-index:1}
  .btn{padding:8px 9px;min-height:36px}
  .seg button{padding:8px 7px}
  .hint{display:none}
  .brand{font-size:15px}
}
</style>

<body>
<div class="topbar">
  <div class="brand">Vanity<span>Lab</span></div>
  <div class="tagline" data-i18n="tagline">参数化浴室柜设计工具</div>
  <div class="spacer"></div>
  <div class="seg" id="langSeg" style="display:none"><button data-l="en">EN</button><button data-l="zh" class="on">中文</button></div>
  <button class="btn primary" id="sceneBtn" data-i18n="sceneBtn">快速配置</button>
  <button class="btn" id="mToggle" data-i18n="panels">面板</button>
  <div class="seg" id="modes"><button data-m="design" class="on">设计</button><button data-m="dim">标注</button><button data-m="render">效果图</button></div>
  <div class="seg" id="views"><button data-v="persp" class="on">3D</button><button data-v="front">正面</button><button data-v="side">侧面</button><button data-v="top">俯视</button></div>
  <button class="btn" id="fit" data-i18n="fit">适应视图</button>
  <div class="seg" id="units"><button data-u="mm" class="on">mm</button><button data-u="in">英寸</button></div>
  <button class="btn on" id="dims" data-i18n="dims">标注</button>
  <button class="btn" id="undo" data-i18n="undo">撤销</button>
  <button class="btn" id="redo" data-i18n="redo">重做</button>
  <details class="menu"><summary data-i18n="export">导出</summary><div class="menuBox">
    <button class="btn primary" id="sheet" data-i18n="sheetBtn">客户确认单</button>
    <button class="btn" id="png">PNG</button>
    <button class="btn" id="glb">GLB</button>
    <button class="btn" id="bom" data-i18n="bomBtn">物料清单 / CSV</button>
  </div></details>
</div>
<div class="main">
  <aside class="sidebar left" id="left">
    <input class="search" id="search">
    <details class="grp"><summary data-i18n="brands">品牌模型库</summary>
    <div class="chips" id="brandTabs"></div>
    <div id="brandPresets"></div>
    <div class="legal" data-i18n="disclaimer"></div></details>
    <div class="sect" data-i18n="components">组件</div>
    <div id="library"></div>
  </aside>
  <div class="viewport" id="viewport">
    <div id="loading">正在加载 3D 引擎…</div>
    <div id="warn" style="display:none"></div>
    <div id="issues" style="display:none"></div>
    <div class="badge" id="badge">未选择组件</div>
    <div class="hint" data-i18n="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击选择</div>
    <div class="ctxbar" id="ctxbar"></div>
    <div class="guide" id="guide" hidden><b id="guideTitle"></b><p id="guideText"></p><div class="row"><button class="btn" id="guideSkip">跳过</button><button class="btn primary" id="guideNext">下一步</button></div></div>
    <div class="scrim" id="scrim"></div>
  </div>
  <aside class="sidebar right" id="right">
    <h2 class="h" data-i18n="properties">属性</h2>
    <div class="sub" id="propsHint">选择组件，或点击组件库中的项目。</div>
    <div id="props"></div>
    <details class="grp"><summary data-i18n="bom">物料清单</summary>
    <table id="bomTable"><thead><tr><th data-i18n="part">部件</th><th data-i18n="size">尺寸</th><th data-i18n="qty">数量</th></tr></thead><tbody></tbody></table></details>
    <details class="grp"><summary data-i18n="project">方案</summary>
    <select id="projectSel" style="margin-bottom:6px"></select>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn" id="newProj" data-i18n="newP">新建</button>
      <button class="btn" id="saveAs" data-i18n="saveAs">另存为</button>
      <button class="btn" id="renameProj" data-i18n="rename">重命名</button>
      <button class="btn" id="delProj" data-i18n="delP">删除</button>
    </div>
    <div class="row" style="flex-wrap:wrap;margin-top:6px">
      <button class="btn" id="saveJson" data-i18n="saveJson">保存 JSON</button>
      <button class="btn" id="loadJson" data-i18n="openJson">打开 JSON</button>
      <button class="btn" id="clearAll" data-i18n="clear">清空</button>
    </div>
    <input type="file" id="fileIn" accept="application/json" hidden></details>
  </aside>
</div>
<div class="start" id="start" hidden>
  <div class="startBox">
    <h2>三分钟出一套方案</h2>
    <p>选几项、填一个宽度，立即出图。细节进去再拖、再改数值。</p>
    <div class="wiz">
      <div class="q"><label>1 · 柜体怎么装</label><div class="opts" data-q="mount">
        <button class="opt on" data-v="wall">挂墙</button><button class="opt" data-v="floor">落地</button><button class="opt" data-v="shelf">带侧柜</button>
      </div></div>
      <div class="q"><label>2 · 主柜多长（mm）</label><div class="widthRow">
        <input type="number" id="qWidth" value="900" min="450" max="1800" step="10">
        <div class="chips" id="widthChips"><button data-w="600">600</button><button data-w="800">800</button><button data-w="900" class="on">900</button><button data-w="1200">1200</button><button data-w="1500">1500</button></div>
      </div></div>
      <div class="q"><label>3 · 台面与盆</label><div class="opts" data-q="basin">
        <button class="opt on" data-v="岩板一体盆">岩板一体盆</button><button class="opt" data-v="岩板台上盆">岩板台上盆</button><button class="opt" data-v="陶瓷一体盆">陶瓷一体盆</button><button class="opt" data-v="双盆">双盆</button>
      </div></div>
      <div class="q"><label>4 · 门抽形式</label><div class="opts" data-q="front">
        <button class="opt on" data-v="双抽">双抽</button><button class="opt" data-v="双门">双门</button><button class="opt" data-v="一门双抽">一门双抽</button><button class="opt" data-v="三抽">三抽</button>
      </div></div>
      <div class="q"><label>5 · 上面配什么</label><div class="opts" data-q="mirror">
        <button class="opt on" data-v="双门镜柜">双门镜柜</button><button class="opt" data-v="单门镜柜">单门镜柜</button><button class="opt" data-v="圆镜">圆镜</button><button class="opt" data-v="不要">不要</button>
      </div></div>
    </div>
    <div class="startFoot"><button class="btn" id="startClose">先看默认方案</button><button class="btn primary" id="wizGen">生成方案</button></div>
  </div>
</div>

function lensShape(kind,W,H){
  const s=new THREE.Shape(),w=W/2,h=H/2;

    s.absarc(0,0,Math.min(w,h),0,Math.PI*2,false);
  }else if(kind==='ellipse'){
    s.absellipse(0,0,w,h,0,Math.PI*2,false,0);
  }else if(kind==='capsule'){
    const r=Math.min(w,h/2),st=h-r;
    s.moveTo(-w,-st);s.lineTo(w,-st);
    s.absarc(w,0,r,-Math.PI/2,Math.PI/2,false);
    s.lineTo(-w,st);
    s.absarc(-w,0,r,Math.PI/2,Math.PI*1.5,false);
  }else if(kind==='arch'){
    const r=w;
    s.moveTo(-w,-h);s.lineTo(w,-h);s.lineTo(w,h-r);
    s.absarc(0,h-r,r,0,Math.PI,false);
    s.lineTo(-w,-h);

    const r=Math.min(28,w*.25,h*.25);

    s.lineTo(-w+r,h);s.quadraticCurveTo(-w,h,-w,h-r);

function buildLens(p,g){

function buildShelf(p,g){

  mesh(rbox(T,H,D,2),mat(p.material),W/2-T/2,y,0,g);
  mesh(rbox(W,T,D,2),mat(p.material),0,T/2,0,g);

}
function buildModule(m){

/* ---------- overlap detection ---------- */
let collisionGroup=null;
function moduleRect(m){const f=footprint(m);return {x1:m.pos.x-f.w/2,x2:m.pos.x+f.w/2,z1:m.pos.z-f.d/2,z2:m.pos.z+f.d/2};}
// ponytail: a suite is stacked vertically (mirror above vanity) — 2D overlap alone
// is a false alarm. Share one y-range with the dimension code so they never drift.
function moduleYRange(m){
  const p=m.params;
  if(m.type==='vanity'){
    const lo=p.mount==='wall'?(p.topHeight||850)-p.height:0;
    return {y1:lo,y2:lo+p.height+26};
  }
  if(m.type==='mirror'){
    const lo=p.bottomHeight||1080;
    return {y1:lo,y2:lo+p.height};
  }
  if(m.type==='lens'){
    const lo=p.bottomHeight||1000;
    return {y1:lo,y2:lo+p.height};
  }
  return {y1:0,y2:p.height};
}
function collisionIds(){
  const ids=new Set();
  for(let i=0;i<state.modules.length;i++)for(let j=i+1;j<state.modules.length;j++){
    const a=moduleRect(state.modules[i]),b=moduleRect(state.modules[j]);
    const ay=moduleYRange(state.modules[i]),by=moduleYRange(state.modules[j]);
    const ox=Math.min(a.x2,b.x2)-Math.max(a.x1,b.x1);
    const oz=Math.min(a.z2,b.z2)-Math.max(a.z1,b.z1);
    const oy=Math.min(ay.y2,by.y2)-Math.max(ay.y1,by.y1);
    if(ox>10&&oz>10&&oy>10){ids.add(state.modules[i].id);ids.add(state.modules[j].id);}
  }

}
function updateCollisions(){
  if(collisionGroup){scene.remove(collisionGroup);collisionGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});collisionGroup=null;}
  if(!scene||!root)return;
  const ids=collisionIds(),g=new THREE.Group();
  for(const id of ids){const c=root.children.find(x=>x.userData.moduleId===id);if(c)g.add(new THREE.BoxHelper(c,0xc0392b));}
  collisionGroup=g;scene.add(g);
  const warn=$('#warn');
  if(warn){warn.style.display=ids.size?'block':'none';warn.textContent=ids.size?`⚠ ${ids.size} ${lang==='zh'?'个组件':'component'+(ids.size>1?'s':'')}${lang==='zh'?'':' '}${T('overlap')}`:'';}
}
/* ---------- dimension annotations (SketchUp-style) ---------- */
let dimGroup=null;

function updateDimensions(){
  if(dimGroup){scene.remove(dimGroup);dimGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});dimGroup=null;}

  const m=state.modules.find(x=>x.id===state.selectedId);if(!m)return;
  const p=m.params,ox=m.pos.x,oz=m.pos.z,M=cabinetMetrics(p),W=p.width,D=p.depth;
  const {y1:lo,y2:hi}=moduleYRange(m);
  const bodyH=p.height;
  const g=new THREE.Group(),OFF=150,ZF=oz+D/2+OFF,COL=0x18796e;
  const V=a=>new THREE.Vector3(a[0],a[1],a[2]);
  const line=(a,b)=>g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:COL})));

  const arrow=(tip,dir,perp,sz)=>{
    const d=dir.clone().normalize(),pp=perp.clone().normalize().multiplyScalar(sz*.38),ds=d.multiplyScalar(sz);
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute([...tip.toArray(),...(tip.clone().add(ds).add(pp)).toArray(),...(tip.clone().add(ds).sub(pp)).toArray()],3));
    geo.computeVertexNormals();

  };
  const label=(str,x,y,z,sc)=>{
    const c=document.createElement('canvas');c.width=384;c.height=64;
    const ctx=c.getContext('2d');ctx.font='700 32px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.strokeText(str,192,34);
    ctx.fillStyle='#141414';ctx.fillText(str,192,34);

    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
    sp.position.set(x,y,z);sp.scale.set(sc||250,(sc||250)/6,1);g.add(sp);

    dim([ox-W/2,hi+OFF/2,ZF],[ox+W/2,hi+OFF/2,ZF],[0,1,0],fmtDim(W));
    dim([ox-W/2-OFF,lo,oz+D/2],[ox-W/2-OFF,lo+bodyH,oz+D/2],[-1,0,0],fmtDim(bodyH));
    dim([ox+W/2+OFF,lo+20,oz-D/2],[ox+W/2+OFF,lo+20,oz+D/2],[0,1,0],fmtDim(D));
    dim([ox-W/2-2*OFF,0,oz+D/2],[ox-W/2-2*OFF,hi,oz+D/2],[-1,0,0],fmtDim(hi));
    if(p.drawerCount>0){const dw=Math.round(W-2*M.T);dim([ox-dw/2,lo-70,ZF],[ox+dw/2,lo-70,ZF],[0,1,0],fmtDim(dw)+' / 抽屉');}
    if(p.basin!=='none'){
      const r=Math.round(M.basinR),bn=p.basinCount||1;

    }
  }else if(m.type==='mirror'){
    dim([ox-W/2,hi+OFF,ZF],[ox+W/2,hi+OFF,ZF],[0,1,0],fmtDim(W));
    dim([ox-W/2-OFF,lo,oz+D/2],[ox-W/2-OFF,hi,oz+D/2],[-1,0,0],fmtDim(p.height));
    dim([ox+W/2+OFF,lo+20,oz-D/2],[ox+W/2+OFF,lo+20,oz+D/2],[0,1,0],fmtDim(D));

  }else{
    dim([ox-W/2,hi+OFF,ZF],[ox+W/2,hi+OFF,ZF],[0,1,0],fmtDim(W));
    dim([ox-W/2-OFF,lo,oz+D/2],[ox-W/2-OFF,hi,oz+D/2],[-1,0,0],fmtDim(p.height));
    dim([ox+W/2+OFF,lo+20,oz-D/2],[ox+W/2+OFF,lo+20,oz+D/2],[0,1,0],fmtDim(D));
    if(p.shelves>0)leader([ox,lo+p.height/2,oz],[ox+120,lo+p.height/2+60,ZF],fmtDim(p.height/(p.shelves+1))+' 层距');

  }
  dimGroup=g;g.visible=mode!=='render';scene.add(g);
}

const mirrorWidthFor=w=>Math.max(250,Math.min(1800,Math.round(w/10)*10));

function setParam(k,v){

  if(sf&&!sf.t&&Number.isFinite(v))v=Math.max(sf.min,Math.min(sf.max,v));
  if(k.startsWith('tune.')){
    m.params.tune=m.params.tune||{};m.params.tune[k.slice(5)]=v;
    rebuildModule(m);save();return;
  }
  m.params[k]=v;
  if((m.type==='mirror'||m.type==='lens')&&k==='width')m.params.wLock=true;
  if((m.type==='mirror'||m.type==='lens')&&k==='bottomHeight')m.params.bLock=true;
  if(k==='material'||k==='countertop'){
    const d=MATERIALS[v]||MATERIALS.white;
    m.params.tune={r:d.r,m:d.m||0,cc:d.cc||0};
  }
  if(k==='drawerCount'&&v>0)m.params.doorCount=0;
  if(k==='doorCount'&&v>0)m.params.drawerCount=0;
  if(m.type==='vanity'&&(k==='width'||k==='topHeight'))followMirror(k,v);

function placeTileComponent(it,x,z){

  if(cur&&cur.type===it.t){
    cur.params={...clone(DEFAULTS[it.t]),...it.p};

  }

function validate(m){
  const p=m.params,out=[];
  if(m.type==='vanity'){
    const M=cabinetMetrics(p),T=M.T,gD=M.gD;
    if(p.drawerCount>0){const w=M.drawerW;if(w<120)out.push({msg:`Drawer face ${Math.round(w)} mm < 120 mm minimum`,z:`抽屉面板 ${Math.round(w)} mm 小于最小 120 mm`,fix:{frontLayout:'stack',drawerCount:Math.max(0,Math.floor((p.width-2*T)/(120+gD))-1)}});}
    if(p.doorCount>0){const w=M.doorW;if(w<180)out.push({msg:`Door leaf ${Math.round(w)} mm < 180 mm minimum`,z:`门板宽 ${Math.round(w)} mm 小于最小 180 mm`,fix:{frontLayout:'stack',doorCount:Math.max(0,Math.floor((p.width-2*T)/(180+M.gDoor))-1)}});}
    if(p.drawerCount===2&&p.drawerSplit&&Math.abs(p.drawerSplit-.5)>.01&&Math.min(...M.drawerHs)<80)out.push({msg:'Sub-mother drawer too short',z:'子母抽有一格高度不足 80 mm',fix:{drawerSplit:0.5}});
    if(p.basin!=='none'){
      const r=p.basin==='vessel'?175:Math.min(p.width*.26,p.depth*.31),n=p.basinCount||1;
      if(2*r>p.width-40)out.push({msg:'Basin exceeds countertop width',z:'盆体超出台面宽度',fix:{basin:'none'}});
      if(n===2&&p.width*.48<2*r+40)out.push({msg:'Two basins overlap',z:'双盆相互重叠',fix:{basinCount:1}});
      const fz=-(p.depth*.31+60);
      if(Math.abs(fz)+14>p.depth/2+10)out.push({msg:'Faucet hole outside countertop',z:'龙头孔超出台面范围',fix:{depth:Math.ceil((Math.abs(fz)+24)*2/10)*10}});
    }
    if(p.mount==='wall'&&p.topHeight-p.height<100)out.push({msg:'Carcass bottom below 100 mm',z:'柜体底部离地不足 100 mm',fix:{topHeight:p.height+100}});
    if((p.basinCount||1)===2&&p.width<1000)out.push({msg:'Double basin needs 1000 mm minimum',z:'双盆柜体宽度需 ≥ 1000 mm，否则两个盆会重叠',fix:{basinCount:1}});
    if(p.width<=350&&p.height>1500)out.push({msg:'Narrow carcass height max 1500 mm',z:'窄柜（长 ≤ 350 mm）高度上限 1500 mm',fix:{height:1500}});
    if(p.height<=350&&p.width>1500)out.push({msg:'Low carcass width max 1500 mm',z:'矮柜（高 ≤ 350 mm）宽度上限 1500 mm',fix:{width:1500}});
    if(p.depth<400)out.push({msg:'Depth below 400 mm',z:'柜体深度建议 ≥ 400 mm，太浅放不下标准盆',fix:{depth:400}});
  }
  if(m.type==='mirror'&&p.bottomHeight<800)out.push({msg:'Mirror cabinet mounted too low',z:'镜柜安装高度过低',fix:{bottomHeight:820}});
  if((m.type==='mirror'||m.type==='lens')&&p.doors>0&&p.width/p.doors<180)out.push({msg:'Mirror door too narrow',z:'镜门过窄，单扇门建议 ≥ 180 mm',fix:{doors:Math.max(1,Math.floor(p.width/180))}});
  if((m.type==='mirror'||m.type==='lens'||m.type==='shelf')&&p.width<=350&&p.height>1500)out.push({msg:'Narrow unit height max 1500 mm',z:'窄柜（长 ≤ 350 mm）高度上限 1500 mm',fix:{height:1500}});
  if((m.type==='mirror'||m.type==='lens')&&p.height<=350&&p.width>1500)out.push({msg:'Low unit width max 1500 mm',z:'矮柜（高 ≤ 350 mm）宽度上限 1500 mm',fix:{width:1500}});
  if(m.type==='mirror'&&p.depth<100)out.push({msg:'Mirror depth below 100 mm',z:'镜柜深度建议 ≥ 100 mm，放不下收纳',fix:{depth:100}});
  if(m.type==='lens'&&p.height<p.width*.5)out.push({msg:'Lens too flat',z:'镜片高度过矮，建议不低于宽度的一半',fix:{height:Math.round(p.width*.6)}});
  if(m.type==='shelf'&&p.height/(p.shelves+1)<150)out.push({msg:'Shelf spacing < 150 mm',z:'层板间距小于 150 mm，拿取不便',fix:{shelves:Math.max(0,Math.floor(p.height/150)-1)}});
  return out;
}

// pure compiler: params -> panel list. No Three.js, no DOM. Quote/BOM and geometry share cabinetMetrics().
function compilePanels(){

  for(const m of state.modules){
    const p=m.params,M=cabinetMetrics(p);
    if(m.type==='vanity'){
      rows.push({part:'Carcass',size:`${p.width}×${p.height}×${p.depth}`,qty:1});
      if(p.drawerCount>0){
        // sub-mother drawers: one row per distinct height so the BOM reflects the model
        const groups={};
        for(let i=0;i<p.drawerCount;i++){const h=Math.round(M.drawerHs[i]||M.drawerH);groups[h]=(groups[h]||0)+1;}
        for(const h in groups)rows.push({part:'Drawer fronts',size:`${Math.round(M.drawerW)}×${h}×18`,qty:groups[h]});
      }
      if(p.doorCount>0)rows.push({part:'Door fronts',size:`${Math.round(M.doorW)}×${p.height-2*M.T}×18`,qty:p.doorCount});
      rows.push({part:'Countertop',size:`${M.counterW}×26×${M.counterD}`,qty:1});
      const bn=p.basinCount||1,r=Math.round(M.basinR);
      if(p.basin==='integrated')rows.push({part:'Integrated basin',size:`Ø${r*2}×22`,qty:bn});
      else if(p.basin==='vessel')rows.push({part:'Vessel basin',size:'Ø350×120',qty:bn});
      if(p.basin!=='none')rows.push({part:'Countertop cut-outs',size:`Ø${r*2} × ${bn} + 龙头孔 Ø28`,qty:1});
      if(p.mount==='floor')rows.push({part:'Support feet',size:`24×${M.feetH}×24`,qty:4});
      if(p.handle&&p.handle!=='none')rows.push({part:'Handles',size:({recessed:'隐形拉手',bar:'明装长拉手',knob:'圆形拉手'})[p.handle]||p.handle,qty:p.drawerCount+p.doorCount});
    }else if(m.type==='mirror'){
      rows.push({part:'Mirror cabinet',size:`${p.width}×${p.height}×${p.depth}`,qty:1});
      // same widths as buildMirror (doorSplit for 2 doors), and never emit a qty=0 / Infinity row
      const n=p.doors||0,gap=5,inner=p.width-16-gap*(n+1),widths=[];
      if(n===2){const r=Math.min(.75,Math.max(.25,p.doorSplit||.5));widths.push(inner*r,inner*(1-r));}
      else for(let i=0;i<n;i++)widths.push(n?inner/n:0);
      for(const w of widths)if(w>0)rows.push({part:'Mirror doors',size:`${Math.round(w)}×${p.height-16}×6`,qty:1});
      if(p.led&&p.lightStyle&&p.lightStyle!=='none')rows.push({part:'LED lighting',size:({top:'顶灯条',back:'背光',ring:'环形跑道灯',sides:'双侧灯',front:'前发光'})[p.lightStyle]||p.lightStyle,qty:1});
    }else if(m.type==='lens'){
      rows.push({part:'Mirror sheet',size:`${p.width}×${p.height}×${p.depth} · ${({rect:'方形',circle:'圆形',ellipse:'椭圆形',capsule:'跑道形',arch:'异形拱门'})[p.shape]||p.shape}`,qty:1});
      rows.push({part:'Mirror frame',size:`${p.width+18}×${p.height+18}`,qty:1});
      if(p.led&&p.lightStyle&&p.lightStyle!=='none')rows.push({part:'LED lighting',size:({top:'顶灯条',back:'背光',ring:'环形跑道灯',sides:'双侧灯',front:'前发光'})[p.lightStyle]||p.lightStyle,qty:1});
      if(p.defog)rows.push({part:'Defog film',size:'除雾膜',qty:1});
    }else{
      rows.push({part:'Side panels',size:`18×${p.height}×${p.depth}`,qty:2});
      if(p.shelves>0)rows.push({part:'Shelves',size:`${p.width-36}×14×${p.depth-10}`,qty:p.shelves});
      rows.push({part:'Top / bottom',size:`${p.width}×18×${p.depth}`,qty:2});
      if(!p.open)rows.push({part:'Back panel',size:`${p.width-36}×${p.height-36}×10`,qty:1});
    }
  }
  return rows;
}
const BOM_ZH={'Carcass':'柜体','Drawer fronts':'抽屉面板','Door fronts':'门板','Countertop':'台面','Integrated basin':'一体盆','Vessel basin':'台上盆','Countertop cut-outs':'台面开孔','Support feet':'支撑脚','Mirror cabinet':'镜柜','Mirror doors':'镜门','Mirror sheet':'镜片','Mirror frame':'镜片边框','LED lighting':'灯光','Defog film':'除雾膜','Handles':'拉手','Back panel':'背板','Side panels':'侧板','Shelves':'层板','Top / bottom':'顶板 / 底板'};

function renderBOM(){

/* ---------- camera / scene ---------- */
function setView(v){

  if(dimGroup)box.union(new THREE.Box3().setFromObject(dimGroup));
  const c=box.isEmpty()?new THREE.Vector3(0,700,0):box.getCenter(new THREE.Vector3());
  const size=box.isEmpty()?new THREE.Vector3(900,800,500):box.getSize(new THREE.Vector3());
  const max=Math.max(size.x,size.y,size.z,700);
  const dist=max*1.9;
  const dir={persp:[0.85,0.62,1.25],front:[0,0.12,1],side:[1,0.12,0],top:[0,1,0.001]}[v];
  camera.position.copy(c).addScaledVector(new THREE.Vector3(...dir).normalize(),dist);
  controls.target.copy(c);controls.update();
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}

  dl.shadow.mapSize.set(2048,2048);dl.shadow.camera.left=-2500;dl.shadow.camera.right=2500;dl.shadow.camera.top=2500;dl.shadow.camera.bottom=-2500;scene.add(dl);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(8000,8000),new THREE.MeshStandardMaterial({color:0xe8ecee,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

const D_WALL=300;
// ponytail: installation constraints — wall is a real plane at z=-D_WALL, not empty space.
// Each type's back face sits at a different local offset, so anchorZ is type-aware.
function wallMounted(m){return m.type==='mirror'||m.type==='lens'||(m.type==='vanity'&&m.params.mount==='wall');}
function backExtent(m){
  const d=footprint(m).d;
  if(m.type==='mirror')return d;              // mirror body centred at -d/2 -> back at -d
  if(m.type==='lens')return d/2;               // extruded sheet centred on local z=0
  if(m.type==='vanity')return (d+20)/2;        // countertop overhang is the deepest part
  return d/2;                                  // shelf carcass centred
}
function anchorZ(m){return -D_WALL+backExtent(m);}
function clampZ(m,z){return wallMounted(m)?anchorZ(m):Math.max(anchorZ(m),z);}
// ponytail: centre alignment guide — snap moving module's centre to another's centre.
const SNAP_CENTER=40; // mm tolerance
let centerGuide=null;
function snapCenterX(m,x){
  let best=null,bd=SNAP_CENTER;
  for(const o of state.modules){
    if(o.id===m.id)continue;
    const d=Math.abs(x-o.pos.x);
    if(d<bd){bd=d;best=o.pos.x;}
  }
  return best; // null = no snap
}
function updateCenterGuide(x){
  if(!scene)return;
  if(!centerGuide){
    const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,2400,0)]);
    centerGuide=new THREE.Line(g,new THREE.LineDashedMaterial({color:0x1f7a6f,dashSize:24,gapSize:16,linewidth:1}));
    centerGuide.computeLineDistances();scene.add(centerGuide);
  }
  if(x===null){centerGuide.visible=false;return;}
  centerGuide.visible=true;
  centerGuide.position.set(x,0,0);
}

function animateFronts(){
  for(const g of root.children){
    const m=state.modules.find(x=>x.id===g.userData.moduleId);
    if(!m||!g.userData.fronts)continue;
    for(const f of g.userData.fronts){
      if(f.type==='drawer'){
        const target=f.base+(m.params.open?f.travel:0);
        f.pv.position.z+=(target-f.pv.position.z)*.16;
      }else{
        const target=m.params.open?f.angle:0;
        f.pv.rotation.y+=(target-f.pv.rotation.y)*.16;
      }
    }
  }
}
function toggleFronts(){
  const m=state.modules.find(x=>x.id===state.selectedId);if(!m||m.params.open===undefined)return;
  m.params.open=m.params.open?0:1;save();renderProps();toast(m.params.open?'Fronts opened':'Fronts closed');
}
function ndc(e){const r=renderer.domElement.getBoundingClientRect();return new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);}
function pick(e){
  raycaster.setFromCamera(ndc(e),camera);
  const hits=raycaster.intersectObjects(root.children,true);
  if(hits.length){let o=hits[0].object;while(o&&!o.userData.moduleId)o=o.parent;return o?o.userData.moduleId:null;}
  return null;
}
let downPt=null,drag=null;
function onDown(e){

    state.selectedId=id;updateSelection();renderProps();updateBadge();
    if(window.innerWidth<=900&&id!=null)setPanels(2);
    raycaster.setFromCamera(ndc(e),camera);const pt=new THREE.Vector3();
    if(raycaster.ray.intersectPlane(floorPlane,pt)){

}
function onMove(e){

  raycaster.setFromCamera(ndc(e),camera);const pt=new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(floorPlane,pt))return;
  const m=state.modules.find(x=>x.id===drag.id);if(!m)return;
  let nx=Math.round((pt.x+drag.ox)/10)*10;

    m.pos.x=nx;m.pos.z=nz;drag.moved=true;
    rebuildModule(m);renderBOM();updateBadge();save();
    const fx=document.querySelector('[data-pos="x"]'),fz=document.querySelector('[data-pos="z"]');
    if(fx)fx.value=nx;if(fz)fz.value=nz;
  }
}
function onUp(e){
  renderer.domElement.style.cursor='';
  if(drag){const moved=drag.moved;drag=null;controls.enabled=true;downPt=null;updateCenterGuide(null);if(moved)pushHistory();return;}
  if(!downPt)return;const d=Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y);downPt=null;if(d>4)return;
  const id=pick(e);state.selectedId=id;updateSelection();renderProps();updateBadge();
}
function snapDrop(x,z,W,D){
  let sx=Math.round(x/50)*50;
  for(const o of state.modules){
    const f=footprint(o),ow=f.w||400;
    let best=null,bd=120;
    for(const c of [o.pos.x-ow/2-W/2,o.pos.x+ow/2+W/2,o.pos.x]){
      const d=Math.abs(sx-c);if(d<bd){bd=d;best=c;}
    }
    if(best!==null){sx=best;break;}
  }
  return {x:sx,z:Math.round(z/50)*50}; // z is clamped to wall in addModule
}
function onDrop(e){
  e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(!raw)return;
  const {g,i}=JSON.parse(raw);const it=TILES.find(x=>x.g===g).items[i];
  raycaster.setFromCamera(ndc(e),camera);const pt=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(floorPlane,pt)&&!it.a){
    const W=(it.p&&it.p.width)||DEFAULTS[it.t].width;
    const D=(it.p&&it.p.depth)||DEFAULTS[it.t].depth;
    const s=snapDrop(pt.x,pt.z,W,D);
    placeTileComponent(it,s.x,s.z);
  }
  else if(it.a)applyTile(it);
}

/* ---------- customer confirmation sheet ---------- */
// ponytail: reuse the live renderer for drawing views — no SVG/PDF library needed.
function snapshotViews(){
  const savedView=currentView;
  const savedPos=camera.position.clone(),savedTarget=controls.target.clone();
  const shots={};
  for(const v of ['persp','front','side','top']){
    setView(v);
    renderer.render(scene,camera);
    shots[v]=renderer.domElement.toDataURL('image/png');
  }
  camera.position.copy(savedPos);controls.target.copy(savedTarget);controls.update();
  currentView=savedView;
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===savedView));
  renderer.render(scene,camera);
  return shots;
}

  const html=`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>${name} · 客户确认单</title>
<style>

.meta{display:flex;gap:24px;flex-wrap:wrap;border-top:2px solid #222;border-bottom:1px solid #bbb;padding:7px 0;margin-bottom:10px}

</style></head><body>

/* ---------- wire UI ---------- */
function setLang(l){
  lang=l;localStorage.setItem('vanitylab-lang',l);
  document.documentElement.lang=l==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  $('#search').placeholder=T('search');
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  renderLibrary();renderBrandTabs();renderBrandPresets();renderProps();renderBOM();updateBadge();updateCollisions();
}
$('#langSeg').onclick=e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.l);};
$('#search').oninput=renderLibrary;
$('#units').onclick=e=>{const b=e.target.closest('button');if(!b)return;unit=b.dataset.u;document.querySelectorAll('#units button').forEach(x=>x.classList.toggle('on',x===b));renderProps();updateDimensions();updateBadge();};
$('#dims').onclick=()=>{state.dims=state.dims===false;save();setMode(mode);updateDimensions();};
$('#views').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v);};
$('#fit').onclick=()=>setView(currentView);
$('#projectSel').onchange=e=>activateProject(e.target.value);
$('#newProj').onclick=()=>{const p={id:newPid(),name:(lang==='zh'?'未命名方案 ':'Untitled ')+(projects.length+1),data:{modules:[],selectedId:null,dims:true}};projects.push(p);saveProjects();activateProject(p.id);toast('New project created');};
$('#saveAs').onclick=()=>{const n=prompt(lang==='zh'?'另存为：':'Save current design as:',(projects.find(x=>x.id===currentPid)?.name||(lang==='zh'?'设计':'Design'))+(lang==='zh'?' 副本':' copy'));if(!n)return;const p={id:newPid(),name:n,data:clone(state)};projects.push(p);saveProjects();activateProject(p.id);toast('Saved as "'+n+'"');};
$('#renameProj').onclick=()=>{const p=projects.find(x=>x.id===currentPid);if(!p)return;const n=prompt(lang==='zh'?'重命名方案：':'Rename project:',p.name);if(!n)return;p.name=n;saveProjects();renderProjectUI();};
$('#delProj').onclick=()=>{if(projects.length<2){toast('Cannot delete the only project');return;}const p=projects.find(x=>x.id===currentPid);if(!confirm(lang==='zh'?`删除方案“${p.name}”？`:`Delete "${p.name}"?`))return;projects=projects.filter(x=>x.id!==currentPid);saveProjects();activateProject(projects[0].id);toast('Project deleted');};
$('#saveJson').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=(projects.find(x=>x.id===currentPid)?.name||'vanitylab')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('方案已保存');};
$('#loadJson').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onerror=()=>toast('文件读取失败');
r.onload=()=>{try{const s=JSON.parse(r.result);if(!Array.isArray(s.modules))throw new Error('invalid project');const mods=sanitizeModules(s.modules);if(!mods.length)throw new Error('no valid modules');state.modules=mods;state.selectedId=null;if(typeof s.dims==='boolean')state.dims=s.dims;uid=Math.max(1,...mods.map(m=>m.id+1));commit();setView(currentView);toast('方案已载入');}catch(err){toast('无效的方案文件：'+err.message);}};r.readAsText(f);e.target.value='';};
$('#clearAll').onclick=()=>{if(!confirm(lang==='zh'?'清空当前设计的所有组件？（Ctrl+Z 可撤销）':'Clear all components in this design? (Ctrl+Z to undo)'))return;state.modules=[];state.selectedId=null;commit();toast('Design cleared');};
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#sheet').onclick=openConfirmSheet;
$('#png').onclick=()=>{
  const scale=2,W=viewport.clientWidth,H=viewport.clientHeight;
  const oldS=renderer.getSize(new THREE.Vector2()),oldPR=renderer.getPixelRatio();
  renderer.setPixelRatio(Math.min(devicePixelRatio*scale,3));renderer.setSize(W,H,false);
  renderer.render(scene,camera);
  const a=document.createElement('a');a.download=(projects.find(x=>x.id===currentPid)?.name||'vanitylab')+'.png';a.href=renderer.domElement.toDataURL('image/png');a.click();
  renderer.setPixelRatio(oldPR);renderer.setSize(oldS.x,oldS.y,false);renderer.render(scene,camera);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('PNG 已导出');
};
$('#glb').onclick=()=>{new GLTFExporter().parse(root,buf=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'}));a.download=(projects.find(x=>x.id===currentPid)?.name||'vanitylab')+'.glb';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('GLB 已导出');},err=>toast('GLB export failed: '+err.message),{binary:true});};
$('#bom').onclick=()=>{const rows=renderBOM();const head=unit==='in'?'部件,尺寸(inch),数量\n':'部件,尺寸(mm),数量\n';const csv='\uFEFF'+head+rows.map(r=>`"${r[0]}","${r[1]}",${r[2]}`).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=(projects.find(x=>x.id===currentPid)?.name||'vanitylab')+'-BOM.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('BOM CSV 已导出');};
let panelState=0; // 0 none · 1 library · 2 properties
function setPanels(s){
  panelState=s;
  $('#left').classList.toggle('show',s===1);
  $('#right').classList.toggle('show',s===2);
  $('#scrim').classList.toggle('show',s!==0);
}
$('#mToggle').onclick=()=>setPanels((panelState+1)%3);
$('#scrim').onclick=()=>setPanels(0);
$('#sceneBtn').onclick=showStart;
$('#startClose').onclick=hideStart;
function deleteSelected(){if(state.selectedId==null)return;state.modules=state.modules.filter(x=>x.id!==state.selectedId);state.selectedId=null;commit();}
function duplicateSelected(){const m=state.modules.find(x=>x.id===state.selectedId);if(!m)return;const n={...clone(m),id:uid++,pos:{x:m.pos.x+footprint(m).w/2+300,z:m.pos.z}};state.modules.push(n);state.selectedId=n.id;commit();setView(currentView);}
document.addEventListener('keydown',e=>{
  const tag=document.activeElement?.tagName;
  if(tag==='INPUT'||tag==='SELECT')return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSelected();}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();}
  if(e.key==='Escape'){state.selectedId=null;updateSelection();renderProps();updateBadge();}
});
window.addEventListener('pointerup',onUp);

let mode='design';
function setMode(v){
  mode=v;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===v));
  document.body.classList.toggle('mode-render',v==='render');
  const dimOn=v==='dim'?true:(v==='render'?false:state.dims!==false);
  if(dimGroup)dimGroup.visible=dimOn;
  $('#dims').classList.toggle('on',dimOn);
  if(gridMesh)gridMesh.visible=v!=='render';
  $('#ctxbar').classList.toggle('show',v==='design'&&!!state.selectedId);
  updateDimensions();
}
$('#modes').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);};

/* ---------- boot ---------- */
try{
  loadProjects();currentPid=projects[0].id;
  const d=projects[0].data;
  state.modules=clone(d.modules||[]);state.selectedId=d.selectedId||null;state.dims=d.dims!==false;
  const fresh=!state.modules.length;
  if(fresh){state.modules=wizardModules();state.selectedId=state.modules[0]?.id||null;}
  uid=Math.max(1,...state.modules.map(m=>m.id+1));
  history=[clone(state)];hi=0;
  $('#dims').classList.toggle('on',state.dims!==false);init();rebuildAll();setView('persp');renderLibrary();renderBrandTabs();renderBrandPresets();renderProjectUI();renderProps();renderBOM();updateHistoryBtns();updateBadge();setLang(lang);wireWizard();wireGuide();setMode('design');
  if(fresh)showStart();
}catch(err){loading.classList.add('err');loading.textContent='加载失败：'+err.message;console.error(err);}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
